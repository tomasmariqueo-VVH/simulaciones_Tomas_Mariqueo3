<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <meta name="author" content="Tomás Mariqueo">
    <title>VideoStream</title>
</head>

<body>
    <header class="header">
        <header class="header">
            <nav class="nav">

                <div class="izquierda">
                    <div class="logo">
                        <img src="static/images/" alt="logo">
                        <h2><strong>Video</strong>Stream</h2>
                    </div>
                    <div class="links">
                        <a href="">inicio</a>
                        <a href="">Explorar</a>
                        <a href="">Mi lista</a>
                    </div>
                </div>

                <div class="derecha">
                    <div class="input">
                        <input id="email" type="text">
                        <strong>🔍</strong>
                    </div>
                    <div class="notificacion-perfil">
                        <div class="notificacion">
                            <img src="static/images/" alt="">
                        </div>
                        <div class="perfil">
                            <img src="static/images/" alt="">
                        </div>
                    </div>
                </div>

            </nav>
        </header>
    </header>
    <main class="main">
        <div class="seccion-principal">
            <div class="seccion video">
                <div class="contenedor-video"></div>
                <div class="texto-video">
                    <h2>My Singing Monsters - bbli$zard Island Music Video (Official Teaser for the Complete bb$quad)</h2>
                    <p>3,506,860 views  Sep 5, 2026</p>
                </div>
                <div class="likes">
                    <div class="opcion">
                        <button class="button like">
                            <span>👍</span>
                            <h4>4</h4>
                        </button>
                    </div>
                    <div class="opcion">
                        <button class="button dislike">
                            <span>👎</span>
                            <h4>0</h4>
                        </button>
                    </div>
                    <div class="opcion">
                        <button class="button compartir">
                            <span>🔁</span>
                            <h4>Compartir</h4>
                        </button>
                    </div>
                    <div class="opcion">
                        <button class="button agregar-cola">
                            <span>➕</span>
                            <h4>Agregar a la cola</h4>
                        </button>
                    </div>
                    <div class="opcion puntos-suspensivos">
                        <button class="button">
                            <h4>...</h4>
                        </button>
                    </div>
                </div>
                <div class="canal">
                    <div class="descripcion-canal">
                        <img src="" alt="">
                        <div class="texto-canal">
                            <h3>My Singing Monsters</h3>
                            <p>2.5M subscribers</p>
                        </div>
                    </div>
                    <div class="boton-suscribirse">
                        <button>Suscribirse</button>
                    </div>
                </div>
                <div class="descripcion">
                    <div class="descripcion-texto">
                        <p>–Produced and Animated by Jellybox Studio–</p>
                    </div>
                    <div class="mostrar-mas">
                        <button>Mostrar más ⬇</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="seccion-lateral">
            <div class="lo-siguente">
                <div class="barra-superior">
                    <h3>Siguente en la cola</h3>
                    <button>Limpiar cola</button>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>✖</button>
                    </div>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>✖</button>
                    </div>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>✖</button>
                    </div>
                </div>
            </div>
            <div class="recomendados">
                <div class="barra-superior">
                    <h3>Recomendados</h3>
                    <button>Actualizar</button>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>➕</button>
                    </div>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>➕</button>
                    </div>
                </div>
                <div class="caja-video">
                    <div class="contenedor-miniVideo">

                    </div>
                    <div class="mini-descripcion">
                        <h4></h4>
                        <p></p>
                        <p></p>
                    </div>
                    <div class="agregar-eliminar">
                        <button>➕</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="seccion-inferior">
            <div class="barra-superior">
                <h2>Más videos</h2>
            </div>
            <div class="caja-video inferior">
                <div class="contenedor-miniVideo"></div>
                <div class="mini-descripcion">
                    <h4></h4>
                    <p></p>
                </div>
            </div>
            <div class="caja-video inferior">
                <div class="contenedor-miniVideo"></div>
                <div class="mini-descripcion">
                    <h4></h4>
                    <p></p>
                </div>
            </div>
            <div class="caja-video inferior">
                <div class="contenedor-miniVideo"></div>
                <div class="mini-descripcion">
                    <h4></h4>
                    <p></p>
                </div>
            </div>
            <div class="caja-video inferior">
                <div class="contenedor-miniVideo"></div>
                <div class="mini-descripcion">
                    <h4></h4>
                    <p></p>
                </div>
            </div>
        </div>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
